name: Update TV guide

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_epg.py"
      - ".github/workflows/update-epg.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update guide data
        run: python scripts/update_epg.py

      - name: Commit guide if changed
        run: |
          if git diff --quiet -- guide.json; then
            echo "Guide data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.json
          git commit -m "Update TV guide"
          git push
