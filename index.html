<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BenTV Guide</title>
  <style>
    :root {
      --navy: #17365f;
      --navy-deep: #0c2342;
      --text: #f7fbff;
      --muted: #c8d5e5;
      --selected: #fff59a;
      --selected-text: #13233a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 0%, #274f7b 0%, transparent 34%),
        linear-gradient(180deg, #132e54 0%, #081a30 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    button { font: inherit; }

    .tv {
      width: min(1240px, 100%);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 18px;
      overflow: hidden;
      background: #12345d;
      box-shadow:
        0 26px 70px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 18px;
      align-items: center;
      min-height: 66px;
      padding: 12px 18px;
      background: linear-gradient(180deg, #284f7e, #18385f);
      border-bottom: 1px solid rgba(255,255,255,.28);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand strong {
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: -.04em;
      font-weight: 800;
    }

    .brand span {
      color: #d5e3f2;
      font-size: .82rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .guide-badge {
      padding: 8px 12px;
      border-radius: 8px;
      background: linear-gradient(180deg, #f4f7fb, #cbd7e6);
      color: #162d4c;
      font-weight: 900;
      letter-spacing: .04em;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
    }

    .clock {
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-weight: 800;
      min-width: 86px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(430px, 1.08fr);
      min-height: 320px;
      background: linear-gradient(135deg, rgba(20,57,96,.98), rgba(12,36,68,.98));
    }

    .info {
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid rgba(0,0,0,.35);
      background:
        linear-gradient(135deg, rgba(255,255,255,.055), transparent 45%),
        var(--navy);
    }

    .eyebrow {
      color: #d8e7f6;
      font-weight: 700;
      font-size: .82rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #channelTitle {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 3rem);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .channel-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
      color: var(--muted);
      font-size: .9rem;
    }

    .pill {
      border: 1px solid rgba(255,255,255,.22);
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
    }

    .current-program {
      margin-top: 23px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.18);
    }

    .current-program .label {
      display: block;
      color: #bcd0e4;
      font-size: .73rem;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    #currentProgramTitle {
      display: block;
      font-size: clamp(1.12rem, 2vw, 1.55rem);
      line-height: 1.15;
    }

    #currentProgramTime {
      display: block;
      color: #d2deeb;
      margin-top: 6px;
      font-size: .9rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .action {
      border: 1px solid rgba(255,255,255,.25);
      color: white;
      background: rgba(255,255,255,.08);
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 750;
    }

    .action:hover { background: rgba(255,255,255,.14); }

    .preview {
      position: relative;
      min-height: 320px;
      background: #000;
    }

    .preview iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .preview::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .guide-scroll { overflow-x: auto; }

    .timeline,
    .row {
      display: grid;
      grid-template-columns: 172px repeat(6, minmax(132px, 1fr));
      min-width: 980px;
    }

    .timeline {
      background: linear-gradient(180deg, #244b78, #183a63);
      border-top: 1px solid rgba(255,255,255,.22);
      border-bottom: 1px solid rgba(0,0,0,.5);
    }

    .timeline > div {
      padding: 9px 10px;
      border-right: 1px solid rgba(255,255,255,.24);
      font-weight: 850;
      font-size: .78rem;
      text-align: center;
      letter-spacing: .04em;
      color: #dce9f5;
    }

    .timeline > div:first-child {
      text-align: left;
      font-size: .88rem;
      color: white;
    }

    .guide {
      min-width: 980px;
      background: #102b4d;
    }

    .row {
      min-height: 70px;
      border-bottom: 1px solid rgba(0,0,0,.48);
    }

    .row > * {
      border-right: 1px solid rgba(255,255,255,.25);
    }

    .channel-cell {
      appearance: none;
      width: 100%;
      border-top: 0;
      border-bottom: 0;
      border-left: 0;
      color: #10233d;
      background: linear-gradient(180deg, #9dc5e7, #77a9d1);
      text-align: left;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-weight: 900;
    }

    .channel-cell:hover { filter: brightness(1.05); }

    .number {
      font-size: .95rem;
      font-variant-numeric: tabular-nums;
      opacity: .85;
    }

    .name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .program {
      appearance: none;
      border-top: 0;
      border-bottom: 0;
      border-left: 0;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      background: var(--row-color, #2a4f7e);
      color: #fff;
      min-width: 0;
      cursor: pointer;
    }

    .program:hover { filter: brightness(1.08); }

    .program strong {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: .9rem;
    }

    .program small {
      color: rgba(255,255,255,.72);
      margin-top: 4px;
      font-size: .72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row.selected .channel-cell,
    .row.selected .program.current {
      background: var(--selected);
      color: var(--selected-text);
    }

    .row.selected .program.current small {
      color: rgba(19,35,58,.68);
    }

    .footer {
      padding: 9px 14px;
      background: #0c2441;
      color: #bcd0e4;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      font-size: .76rem;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    .guide-status.error { color: #ffd2d2; }
    .keys { white-space: nowrap; }

    kbd {
      display: inline-block;
      min-width: 22px;
      padding: 2px 5px;
      margin: 0 2px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 5px;
      background: rgba(255,255,255,.08);
      color: #fff;
      text-align: center;
      font: inherit;
      font-weight: 800;
    }

    @media (max-width: 820px) {
      body { padding: 0; }
      .tv { border-radius: 0; border-left: 0; border-right: 0; }
      .masthead { grid-template-columns: 1fr auto; }
      .guide-badge { display: none; }
      .hero { grid-template-columns: 1fr; }

      .info {
        min-height: 235px;
        border-right: 0;
        border-bottom: 2px solid rgba(0,0,0,.35);
      }

      .preview {
        min-height: auto;
        aspect-ratio: 16 / 9;
      }

      .footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="tv">
    <header class="masthead">
      <div class="brand">
        <strong>BenTV</strong>
        <span>Digital Cable</span>
      </div>
      <div class="guide-badge">TV GUIDE</div>
      <div class="clock" id="clock">--:--</div>
    </header>

    <section class="hero">
      <div class="info">
        <div>
          <div class="eyebrow" id="channelLabel">21 · Freeform</div>
          <h1 id="channelTitle">Freeform</h1>

          <div class="channel-meta">
            <span class="pill">LIVE</span>
            <span class="pill" id="channelNumber">CH 21</span>
            <span class="pill">HD</span>
          </div>

          <div class="current-program">
            <span class="label">On now</span>
            <strong id="currentProgramTitle">Loading guide…</strong>
            <span id="currentProgramTime"></span>
          </div>
        </div>

        <div class="actions">
          <button class="action" id="fullscreenBtn">⛶ Fullscreen</button>
          <button class="action" id="guideFocusBtn">▦ Guide</button>
        </div>
      </div>

      <div class="preview">
        <iframe
          id="player"
          src="https://zlive.st/embed/auto-freeform"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
          title="BenTV player"
        ></iframe>
      </div>
    </section>

    <div class="guide-scroll" id="guideScroll">
      <div class="timeline">
        <div>CHANNEL</div>
        <div>NOW</div>
        <div>NEXT</div>
        <div>+2</div>
        <div>+3</div>
        <div>+4</div>
        <div>+5</div>
      </div>

      <section class="guide" id="guide" aria-label="Channel guide"></section>
    </div>

    <footer class="footer">
      <div class="guide-status" id="guideStatus">Loading live TV listings…</div>
      <div class="keys"><kbd>↑</kbd><kbd>↓</kbd> channel &nbsp; <kbd>F</kbd> fullscreen</div>
    </footer>
  </main>

  <script>
    const channels = [
      { number: 21, key: "freeform", name: "Freeform", src: "https://zlive.st/embed/auto-freeform", color: "#2f567f" },
      { number: 22, key: "disney", name: "Disney Channel", src: "https://zlive.st/embed/auto-disney-channel", color: "#654294" },
      { number: 23, key: "nickelodeon", name: "Nickelodeon", src: "https://zlive.st/embed/auto-nickelodeon", color: "#0b7544" },
      { number: 24, key: "nicktoons", name: "Nicktoons", src: "https://zlive.st/embed/auto-nicktoons", color: "#496a8f" },
      { number: 25, key: "teenick", name: "TeenNick", src: "https://zlive.st/embed/auto-teenick", color: "#31557d" },
      { number: 27, key: "trutv", name: "truTV", src: "https://zlive.st/embed/auto-trutv", color: "#536178" },
      { number: 60, key: "cartoonnetwork", name: "Cartoon Network", src: "https://zlive.st/embed/auto-cartoon-network", color: "#39516c" },
      { number: 222, key: "disneyxd", name: "Disney XD", src: "https://zlive.st/embed/auto-disney-xd", color: "#524479" }
    ];

    const guide = document.getElementById("guide");
    const player = document.getElementById("player");
    const channelTitle = document.getElementById("channelTitle");
    const channelLabel = document.getElementById("channelLabel");
    const channelNumber = document.getElementById("channelNumber");
    const currentProgramTitle = document.getElementById("currentProgramTitle");
    const currentProgramTime = document.getElementById("currentProgramTime");
    const clock = document.getElementById("clock");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const guideFocusBtn = document.getElementById("guideFocusBtn");
    const guideScroll = document.getElementById("guideScroll");
    const guideStatus = document.getElementById("guideStatus");

    let selectedIndex = 0;
    let guideData = { channels: {}, generatedAt: null };

    function formatTime(value) {
      const date = value instanceof Date ? value : new Date(value);
      return new Intl.DateTimeFormat([], {
        hour: "numeric",
        minute: "2-digit"
      }).format(date);
    }

    function formatRange(program) {
      if (!program) return "";
      return `${formatTime(program.start)} – ${formatTime(program.stop)}`;
    }

    function updateClock() {
      clock.textContent = formatTime(new Date());
    }

    function programsFor(channel) {
      const now = Date.now();
      const list = (guideData.channels?.[channel.key] || [])
        .filter(program => new Date(program.stop).getTime() > now)
        .sort((a, b) => new Date(a.start) - new Date(b.start));

      const currentIndex = list.findIndex(program => {
        const start = new Date(program.start).getTime();
        const stop = new Date(program.stop).getTime();
        return start <= now && now < stop;
      });

      if (currentIndex >= 0) return list.slice(currentIndex, currentIndex + 6);
      return list.slice(0, 6);
    }

    function updateHeroSchedule() {
      const channel = channels[selectedIndex];
      const programs = programsFor(channel);
      const current = programs[0];

      if (current) {
        currentProgramTitle.textContent = current.title;
        currentProgramTime.textContent = formatRange(current) + (current.subtitle ? ` · ${current.subtitle}` : "");
      } else {
        currentProgramTitle.textContent = "Schedule unavailable";
        currentProgramTime.textContent = "";
      }
    }

    function renderGuide() {
      guide.innerHTML = "";

      channels.forEach((channel, index) => {
        const programs = programsFor(channel);
        const row = document.createElement("div");
        row.className = "row" + (index === selectedIndex ? " selected" : "");
        row.style.setProperty("--row-color", channel.color);

        const channelButton = document.createElement("button");
        channelButton.className = "channel-cell";
        channelButton.type = "button";
        channelButton.innerHTML = `
          <span class="number">${channel.number}</span>
          <span class="name">${channel.name}</span>
        `;
        channelButton.addEventListener("click", () => tune(index));
        row.appendChild(channelButton);

        for (let slot = 0; slot < 6; slot++) {
          const program = programs[slot];
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "program" + (slot === 0 ? " current" : "");

          if (program) {
            const title = document.createElement("strong");
            title.textContent = program.title;

            const time = document.createElement("small");
            time.textContent = formatRange(program);

            cell.append(title, time);
            cell.title = program.subtitle
              ? `${program.title} — ${program.subtitle}`
              : program.title;
          } else {
            const title = document.createElement("strong");
            title.textContent = slot === 0 ? "No listing" : "—";

            const time = document.createElement("small");
            time.textContent = "";
            cell.append(title, time);
          }

          cell.addEventListener("click", () => tune(index));
          row.appendChild(cell);
        }

        guide.appendChild(row);
      });

      updateHeroSchedule();
    }

    function tune(index) {
      selectedIndex = (index + channels.length) % channels.length;
      const channel = channels[selectedIndex];

      if (player.dataset.channel !== channel.key) {
        player.src = channel.src;
        player.dataset.channel = channel.key;
      }

      channelTitle.textContent = channel.name;
      channelLabel.textContent = `${channel.number} · ${channel.name}`;
      channelNumber.textContent = `CH ${channel.number}`;

      localStorage.setItem("bentv-channel", channel.name);
      renderGuide();
    }

    async function loadGuide() {
      try {
        const response = await fetch(`guide.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        guideData = await response.json();

        if (guideData.generatedAt) {
          const updated = new Date(guideData.generatedAt);
          guideStatus.textContent = `TV listings updated ${updated.toLocaleString()}`;
        } else {
          guideStatus.textContent = "TV listings updater is waiting for its first refresh.";
        }

        guideStatus.classList.remove("error");
        renderGuide();
      } catch (error) {
        console.error("Could not load guide data:", error);
        guideStatus.textContent = "Could not load TV listings. The channels still work.";
        guideStatus.classList.add("error");
        renderGuide();
      }
    }

    const saved = localStorage.getItem("bentv-channel");
    const savedIndex = channels.findIndex(channel => channel.name === saved);
    if (savedIndex >= 0) selectedIndex = savedIndex;

    fullscreenBtn.addEventListener("click", async () => {
      const container = document.querySelector(".preview");

      if (!document.fullscreenElement) {
        await container.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    });

    guideFocusBtn.addEventListener("click", () => {
      guideScroll.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        tune(selectedIndex + 1);
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();
        tune(selectedIndex - 1);
      }

      if (event.key.toLowerCase() === "f") {
        fullscreenBtn.click();
      }
    });

    updateClock();
    setInterval(updateClock, 1000);

    tune(selectedIndex);
    loadGuide();

    setInterval(() => {
      renderGuide();
    }, 30000);

    setInterval(loadGuide, 5 * 60 * 1000);
  </script>
</body>
</html>
