<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BenTV Guide</title>
  <style>
    :root {
      --navy: #17365f;
      --navy-deep: #0c2342;
      --text: #f7fbff;
      --muted: #c8d5e5;
      --selected: #fff59a;
      --selected-text: #13233a;
      --channel-width: 172px;
      --track-min-width: 900px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 0%, #274f7b 0%, transparent 34%),
        linear-gradient(180deg, #132e54 0%, #081a30 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    button { font: inherit; }

    .tv {
      width: min(1240px, 100%);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 18px;
      overflow: hidden;
      background: #12345d;
      box-shadow:
        0 26px 70px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 18px;
      align-items: center;
      min-height: 66px;
      padding: 12px 18px;
      background: linear-gradient(180deg, #284f7e, #18385f);
      border-bottom: 1px solid rgba(255,255,255,.28);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand strong {
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: -.04em;
      font-weight: 800;
    }

    .brand span {
      color: #d5e3f2;
      font-size: .82rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand .build-tag {
      font-size: .62rem;
      letter-spacing: .08em;
      opacity: .62;
      font-variant-numeric: tabular-nums;
    }

    .guide-badge {
      padding: 8px 12px;
      border-radius: 8px;
      background: linear-gradient(180deg, #f4f7fb, #cbd7e6);
      color: #162d4c;
      font-weight: 900;
      letter-spacing: .04em;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
    }

    .clock {
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-weight: 800;
      min-width: 86px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(430px, 1.08fr);
      min-height: 320px;
      background: linear-gradient(135deg, rgba(20,57,96,.98), rgba(12,36,68,.98));
    }

    .info {
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid rgba(0,0,0,.35);
      background:
        linear-gradient(135deg, rgba(255,255,255,.055), transparent 45%),
        var(--navy);
    }

    .eyebrow {
      color: #d8e7f6;
      font-weight: 700;
      font-size: .82rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #channelTitle {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 3rem);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .channel-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
      color: var(--muted);
      font-size: .9rem;
    }

    .pill {
      border: 1px solid rgba(255,255,255,.22);
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
    }

    .current-program {
      margin-top: 23px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.18);
    }

    .current-program .label {
      display: block;
      color: #bcd0e4;
      font-size: .73rem;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    #currentProgramTitle {
      display: block;
      font-size: clamp(1.12rem, 2vw, 1.55rem);
      line-height: 1.15;
    }

    #currentProgramTime {
      display: block;
      color: #d2deeb;
      margin-top: 6px;
      font-size: .9rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .action {
      border: 1px solid rgba(255,255,255,.25);
      color: white;
      background: rgba(255,255,255,.08);
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 750;
    }

    .action:hover { background: rgba(255,255,255,.14); }

    .preview {
      position: relative;
      min-height: 320px;
      background: #000;
    }

    .preview iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .preview::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .guide-scroll {
      overflow-x: auto;
      background: #102b4d;
    }

    .timeline,
    .row {
      display: grid;
      grid-template-columns: var(--channel-width) minmax(var(--track-min-width), 1fr);
      min-width: calc(var(--channel-width) + var(--track-min-width));
    }

    .timeline {
      background: linear-gradient(180deg, #244b78, #183a63);
      border-top: 1px solid rgba(255,255,255,.22);
      border-bottom: 1px solid rgba(0,0,0,.55);
    }

    .timeline-label {
      padding: 10px 12px;
      border-right: 2px solid rgba(255,255,255,.28);
      font-size: .9rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
    }

    .time-track {
      position: relative;
      height: 42px;
      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(25% - 1px),
          rgba(255,255,255,.28) calc(25% - 1px),
          rgba(255,255,255,.28) 25%
        );
    }

    .time-label {
      position: absolute;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-weight: 900;
      font-size: .84rem;
      font-variant-numeric: tabular-nums;
      color: #eef6ff;
      white-space: nowrap;
      transform: translateX(0);
    }

    .row {
      min-height: 70px;
      border-bottom: 1px solid rgba(0,0,0,.48);
    }

    .channel-cell {
      appearance: none;
      width: 100%;
      border: 0;
      border-right: 2px solid rgba(255,255,255,.28);
      color: #10233d;
      background: linear-gradient(180deg, #9dc5e7, #77a9d1);
      text-align: left;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-weight: 900;
    }

    .channel-cell:hover { filter: brightness(1.05); }

    .number {
      font-size: .95rem;
      font-variant-numeric: tabular-nums;
      opacity: .85;
    }

    .name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .program-track {
      position: relative;
      min-height: 70px;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(25% - 1px),
          rgba(255,255,255,.19) calc(25% - 1px),
          rgba(255,255,255,.19) 25%
        ),
        var(--row-color, #2a4f7e);
    }

    .program {
      position: absolute;
      top: 0;
      bottom: 0;
      appearance: none;
      border: 0;
      border-right: 2px solid rgba(255,255,255,.30);
      background: rgba(0,0,0,.04);
      color: #fff;
      padding: 9px 10px;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      min-width: 2px;
    }

    .program:hover {
      background: rgba(255,255,255,.10);
    }

    .program strong {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: .91rem;
    }

    .program small {
      display: block;
      color: rgba(255,255,255,.76);
      margin-top: 4px;
      font-size: .72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .program.current.selected-program {
      background: var(--selected);
      color: var(--selected-text);
    }

    .program.current.selected-program small {
      color: rgba(19,35,58,.70);
    }

    .row.selected .channel-cell {
      background: linear-gradient(180deg, #b8d9f3, #8ebce0);
    }

    .no-listing {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding-left: 12px;
      color: rgba(255,255,255,.62);
      font-size: .8rem;
      font-style: italic;
    }

    .now-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ffef5a;
      box-shadow: 0 0 7px rgba(255,239,90,.9);
      z-index: 6;
      pointer-events: none;
    }

    .footer {
      padding: 9px 14px;
      background: #0c2441;
      color: #bcd0e4;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      font-size: .76rem;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    .guide-status.error { color: #ffd2d2; }
    .keys { white-space: nowrap; }

    kbd {
      display: inline-block;
      min-width: 22px;
      padding: 2px 5px;
      margin: 0 2px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 5px;
      background: rgba(255,255,255,.08);
      color: #fff;
      text-align: center;
      font: inherit;
      font-weight: 800;
    }

    @media (max-width: 820px) {
      body { padding: 0; }
      .tv { border-radius: 0; border-left: 0; border-right: 0; }
      .masthead { grid-template-columns: 1fr auto; }
      .guide-badge { display: none; }
      .hero { grid-template-columns: 1fr; }

      .info {
        min-height: 235px;
        border-right: 0;
        border-bottom: 2px solid rgba(0,0,0,.35);
      }

      .preview {
        min-height: auto;
        aspect-ratio: 16 / 9;
      }

      .footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="tv">
    <header class="masthead">
      <div class="brand">
        <strong>BenTV</strong>
        <span>Digital Cable</span>
        <span class="build-tag" id="buildTag">BUILD ----</span>
      </div>
      <div class="guide-badge">TV GUIDE</div>
      <div class="clock" id="clock">--:--</div>
    </header>

    <section class="hero">
      <div class="info">
        <div>
          <div class="eyebrow" id="channelLabel">21 · Freeform</div>
          <h1 id="channelTitle">Freeform</h1>

          <div class="channel-meta">
            <span class="pill">LIVE</span>
            <span class="pill" id="channelNumber">CH 21</span>
            <span class="pill">HD</span>
          </div>

          <div class="current-program">
            <span class="label">On now</span>
            <strong id="currentProgramTitle">Loading guide…</strong>
            <span id="currentProgramTime"></span>
          </div>
        </div>

        <div class="actions">
          <button class="action" id="fullscreenBtn">⛶ Fullscreen</button>
          <button class="action" id="guideFocusBtn">▦ Guide</button>
          <button class="action" id="sourceBtn">↻ Backup</button>
        </div>
      </div>

      <div class="preview">
        <iframe
          id="player"
          src="https://zlive.st/embed/auto-freeform"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
          title="BenTV player"
        ></iframe>
      </div>
    </section>

    <div class="guide-scroll" id="guideScroll">
      <div class="timeline">
        <div class="timeline-label">Today</div>
        <div class="time-track" id="timeTrack"></div>
      </div>

      <section class="guide" id="guide" aria-label="Channel guide"></section>
    </div>

    <footer class="footer">
      <div class="guide-status" id="guideStatus">Loading live TV listings…</div>
      <div class="keys"><kbd>↑</kbd><kbd>↓</kbd> channel &nbsp; <kbd>F</kbd> fullscreen</div>
    </footer>
  </main>

  <script>
    const channels = [
      { number: 21, key: "freeform", name: "Freeform", primarySrc: "https://zlive.st/embed/auto-freeform", backupSrc: "https://dlive.sx/stream/stream-301.php", color: "#2f567f" },
      { number: 22, key: "disney", name: "Disney Channel", primarySrc: "https://zlive.st/embed/auto-disney-channel", backupSrc: "https://dlive.sx/stream/stream-312.php", color: "#654294" },
      { number: 23, key: "nickelodeon", name: "Nickelodeon", primarySrc: "https://zlive.st/embed/auto-nickelodeon", backupSrc: "https://dlive.sx/stream/stream-330.php", color: "#0b7544" },
      { number: 24, key: "nicktoons", name: "Nicktoons", primarySrc: "https://zlive.st/embed/auto-nicktoons", backupSrc: "https://dlive.sx/stream/stream-649.php", color: "#496a8f" },
      { number: 25, key: "teenick", name: "TeenNick", primarySrc: "https://zlive.st/embed/auto-teenick", backupSrc: "https://dlive.sx/stream/stream-650.php", color: "#31557d" },
      { number: 27, key: "trutv", name: "truTV", primarySrc: "https://zlive.st/embed/auto-trutv", backupSrc: "https://dlive.sx/stream/stream-341.php", color: "#536178" },
      { number: 60, key: "cartoonnetwork", name: "Cartoon Network", primarySrc: "https://zlive.st/embed/auto-cartoon-network", backupSrc: "https://dlive.sx/stream/stream-339.php", color: "#39516c" },
      { number: 61, key: "cartoonnetworkuk", name: "Cartoon Network UK", primarySrc: "https://zlive.st/embed/cartoonnetwork-uk", backupSrc: null, color: "#314966" },
      { number: 222, key: "disneyxd", name: "Disney XD", primarySrc: "https://zlive.st/embed/auto-disney-xd", backupSrc: "https://dlive.sx/stream/stream-314.php", color: "#524479" }
    ];

    const WINDOW_MINUTES = 120;
    const HALF_HOUR = 30 * 60 * 1000;

    const guide = document.getElementById("guide");
    const player = document.getElementById("player");
    const channelTitle = document.getElementById("channelTitle");
    const channelLabel = document.getElementById("channelLabel");
    const channelNumber = document.getElementById("channelNumber");
    const currentProgramTitle = document.getElementById("currentProgramTitle");
    const currentProgramTime = document.getElementById("currentProgramTime");
    const clock = document.getElementById("clock");
    const buildTag = document.getElementById("buildTag");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const guideFocusBtn = document.getElementById("guideFocusBtn");
    const sourceBtn = document.getElementById("sourceBtn");
    const guideScroll = document.getElementById("guideScroll");
    const guideStatus = document.getElementById("guideStatus");
    const timeTrack = document.getElementById("timeTrack");

    let selectedIndex = 0;
    let guideData = { channels: {}, generatedAt: null };

    function formatTime(value) {
      const date = value instanceof Date ? value : new Date(value);
      return new Intl.DateTimeFormat([], {
        hour: "numeric",
        minute: "2-digit"
      }).format(date);
    }

    function formatRange(program) {
      if (!program) return "";
      return `${formatTime(program.start)} – ${formatTime(program.stop)}`;
    }

    function getWindowStart() {
      const now = new Date();
      const start = new Date(now);
      start.setSeconds(0, 0);
      start.setMinutes(now.getMinutes() < 30 ? 0 : 30);
      return start;
    }

    function getWindowEnd(windowStart) {
      return new Date(windowStart.getTime() + WINDOW_MINUTES * 60 * 1000);
    }

    function currentProgramFor(channel) {
      const now = Date.now();
      return (guideData.channels?.[channel.key] || []).find(program => {
        const start = new Date(program.start).getTime();
        const stop = new Date(program.stop).getTime();
        return start <= now && now < stop;
      }) || null;
    }

    function visibleProgramsFor(channel, windowStart, windowEnd) {
      const startMs = windowStart.getTime();
      const endMs = windowEnd.getTime();

      return (guideData.channels?.[channel.key] || [])
        .filter(program => {
          const start = new Date(program.start).getTime();
          const stop = new Date(program.stop).getTime();
          return stop > startMs && start < endMs;
        })
        .sort((a, b) => new Date(a.start) - new Date(b.start));
    }

    function updateClock() {
      clock.textContent = formatTime(new Date());
    }

    function renderTimeHeader(windowStart) {
      timeTrack.innerHTML = "";

      for (let minutes = 0; minutes < WINDOW_MINUTES; minutes += 30) {
        const label = document.createElement("div");
        label.className = "time-label";
        label.style.left = `${(minutes / WINDOW_MINUTES) * 100}%`;
        label.textContent = formatTime(new Date(windowStart.getTime() + minutes * 60 * 1000));
        timeTrack.appendChild(label);
      }

      const now = Date.now();
      const start = windowStart.getTime();
      const end = start + WINDOW_MINUTES * 60 * 1000;

      if (now >= start && now < end) {
        const nowLine = document.createElement("div");
        nowLine.className = "now-line";
        nowLine.style.left = `${((now - start) / (end - start)) * 100}%`;
        timeTrack.appendChild(nowLine);
      }
    }

    function updateHeroSchedule() {
      const channel = channels[selectedIndex];
      const current = currentProgramFor(channel);

      if (current) {
        currentProgramTitle.textContent = current.title;
        currentProgramTime.textContent = formatRange(current) + (current.subtitle ? ` · ${current.subtitle}` : "");
      } else {
        currentProgramTitle.textContent = "Schedule unavailable";
        currentProgramTime.textContent = "";
      }
    }

    function renderGuide() {
      const windowStart = getWindowStart();
      const windowEnd = getWindowEnd(windowStart);
      const windowStartMs = windowStart.getTime();
      const windowEndMs = windowEnd.getTime();
      const windowDuration = windowEndMs - windowStartMs;
      const now = Date.now();

      renderTimeHeader(windowStart);
      guide.innerHTML = "";

      channels.forEach((channel, index) => {
        const programs = visibleProgramsFor(channel, windowStart, windowEnd);

        const row = document.createElement("div");
        row.className = "row" + (index === selectedIndex ? " selected" : "");
        row.style.setProperty("--row-color", channel.color);

        const channelButton = document.createElement("button");
        channelButton.className = "channel-cell";
        channelButton.type = "button";
        channelButton.innerHTML = `
          <span class="number">${channel.number}</span>
          <span class="name">${channel.name}</span>
        `;
        channelButton.addEventListener("click", () => tune(index));
        row.appendChild(channelButton);

        const track = document.createElement("div");
        track.className = "program-track";

        if (!programs.length) {
          const empty = document.createElement("div");
          empty.className = "no-listing";
          empty.textContent = "No schedule data for this time";
          track.appendChild(empty);
        }

        programs.forEach(program => {
          const actualStart = new Date(program.start).getTime();
          const actualStop = new Date(program.stop).getTime();
          const clippedStart = Math.max(actualStart, windowStartMs);
          const clippedStop = Math.min(actualStop, windowEndMs);

          const left = ((clippedStart - windowStartMs) / windowDuration) * 100;
          const width = ((clippedStop - clippedStart) / windowDuration) * 100;
          const isCurrent = actualStart <= now && now < actualStop;

          const cell = document.createElement("button");
          cell.type = "button";
          cell.className =
            "program" +
            (isCurrent ? " current" : "") +
            (isCurrent && index === selectedIndex ? " selected-program" : "");
          cell.style.left = `${left}%`;
          cell.style.width = `${width}%`;

          const title = document.createElement("strong");
          title.textContent = program.title;

          const time = document.createElement("small");
          time.textContent = formatRange(program);

          cell.append(title, time);
          cell.title = program.subtitle
            ? `${program.title} — ${program.subtitle} (${formatRange(program)})`
            : `${program.title} (${formatRange(program)})`;

          cell.addEventListener("click", () => tune(index));
          track.appendChild(cell);
        });

        if (now >= windowStartMs && now < windowEndMs) {
          const nowLine = document.createElement("div");
          nowLine.className = "now-line";
          nowLine.style.left = `${((now - windowStartMs) / windowDuration) * 100}%`;
          track.appendChild(nowLine);
        }

        row.appendChild(track);
        guide.appendChild(row);
      });

      updateHeroSchedule();
    }

    function setPlayerSource(channel, source = "primary") {
      const hasBackup = Boolean(channel.backupSrc);
      const useBackup = source === "backup" && hasBackup;
      const nextSrc = useBackup ? channel.backupSrc : channel.primarySrc;

      if (useBackup) {
        player.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-presentation");
      } else {
        player.removeAttribute("sandbox");
      }

      player.src = nextSrc;
      player.dataset.channel = channel.key;
      player.dataset.source = useBackup ? "backup" : "primary";

      sourceBtn.disabled = !hasBackup;
      sourceBtn.textContent = !hasBackup ? "No Backup" : (useBackup ? "↻ Primary" : "↻ Backup");
      sourceBtn.title = !hasBackup
        ? "No backup source is configured for this channel"
        : (useBackup ? "Switch back to zlive.st" : "Switch to sandboxed dlive.sx backup");
    }

    function tune(index) {
      selectedIndex = (index + channels.length) % channels.length;
      const channel = channels[selectedIndex];

      if (player.dataset.channel !== channel.key) {
        setPlayerSource(channel, "primary");
      }

      channelTitle.textContent = channel.name;
      channelLabel.textContent = `${channel.number} · ${channel.name}`;
      channelNumber.textContent = `CH ${channel.number}`;

      localStorage.setItem("bentv-channel", channel.name);
      renderGuide();
    }

    async function loadBuildTag() {
      try {
        const response = await fetch("https://api.github.com/repos/focustap/BenTV/commits/main", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const commit = String(data.sha || "");
        if (commit.length >= 4) {
          buildTag.textContent = `BUILD ${commit.slice(-4).toUpperCase()}`;
          buildTag.title = `Latest main commit: ${commit}`;
        }
      } catch (error) {
        console.warn("Could not load build commit:", error);
      }
    }

    async function loadGuide() {
      try {
        const response = await fetch(`guide.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        guideData = await response.json();

        if (guideData.generatedAt) {
          const updated = new Date(guideData.generatedAt);
          guideStatus.textContent = `TV listings updated ${updated.toLocaleString()}`;
        } else {
          guideStatus.textContent = "TV listings updater is waiting for its first refresh.";
        }

        guideStatus.classList.remove("error");
        renderGuide();
      } catch (error) {
        console.error("Could not load guide data:", error);
        guideStatus.textContent = "Could not load TV listings. The channels still work.";
        guideStatus.classList.add("error");
        renderGuide();
      }
    }

    const saved = localStorage.getItem("bentv-channel");
    const savedIndex = channels.findIndex(channel => channel.name === saved);
    if (savedIndex >= 0) selectedIndex = savedIndex;

    fullscreenBtn.addEventListener("click", async () => {
      const container = document.querySelector(".preview");

      if (!document.fullscreenElement) {
        await container.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    });

    guideFocusBtn.addEventListener("click", () => {
      guideScroll.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    sourceBtn.addEventListener("click", () => {
      const channel = channels[selectedIndex];
      if (!channel.backupSrc) return;
      const nextSource = player.dataset.source === "backup" ? "primary" : "backup";
      setPlayerSource(channel, nextSource);
    });

    player.addEventListener("error", () => {
      if (player.dataset.source !== "backup") {
        setPlayerSource(channels[selectedIndex], "backup");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        tune(selectedIndex + 1);
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();
        tune(selectedIndex - 1);
      }

      if (event.key.toLowerCase() === "f") {
        fullscreenBtn.click();
      }
    });

    updateClock();
    setInterval(updateClock, 1000);

    tune(selectedIndex);
    loadBuildTag();
    loadGuide();

    setInterval(renderGuide, 30000);
    setInterval(loadGuide, 5 * 60 * 1000);
  </script>
</body>
</html>
